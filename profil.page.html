<ion-header>
  <ion-toolbar>

    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>

    <ion-title>
      Profil
    </ion-title>

  </ion-toolbar>
</ion-header>


<ion-content [fullscreen]="true">

  <div class="profile-container">

    <!-- FOTO / ICON PROFIL -->
    <ion-card class="profile-card">

      <ion-card-content>

        <div class="profile-icon">
          👤
        </div>

        <h1>
          Admin SIMOBILE
        </h1>

        <p>
          Administrator
        </p>

      </ion-card-content>

    </ion-card>


    <!-- INFORMASI APLIKASI -->
    <ion-card>

      <ion-card-header>
        <ion-card-title>
          Informasi Profil
        </ion-card-title>
      </ion-card-header>

      <ion-card-content>

        <ion-item>
          <ion-icon
            name="person-outline"
            slot="start">
          </ion-icon>

          <ion-label>
            <h2>Nama</h2>
            <p>Admin SIMOBILE</p>
          </ion-label>
        </ion-item>


        <ion-item>
          <ion-icon
            name="briefcase-outline"
            slot="start">
          </ion-icon>

          <ion-label>
            <h2>Role</h2>
            <p>Administrator</p>
          </ion-label>
        </ion-item>


        <ion-item>
          <ion-icon
            name="phone-portrait-outline"
            slot="start">
          </ion-icon>

          <ion-label>
            <h2>Aplikasi</h2>
            <p>SIMOBILE - Sistem Kasir Mobile</p>
          </ion-label>
        </ion-item>

      </ion-card-content>

    </ion-card>


    <!-- FITUR -->
    <ion-card>

      <ion-card-header>
        <ion-card-title>
          Fitur SIMOBILE
        </ion-card-title>
      </ion-card-header>

      <ion-card-content>

        <ion-item>
          <ion-icon
            name="cube-outline"
            slot="start">
          </ion-icon>

          <ion-label>
            Manajemen Produk
          </ion-label>
        </ion-item>


        <ion-item>
          <ion-icon
            name="cart-outline"
            slot="start">
          </ion-icon>

          <ion-label>
            Keranjang & Transaksi
          </ion-label>
        </ion-item>


        <ion-item>
          <ion-icon
            name="receipt-outline"
            slot="start">
          </ion-icon>

          <ion-label>
            Riwayat Transaksi
          </ion-label>
        </ion-item>


        <ion-item>
          <ion-icon
            name="moon-outline"
            slot="start">
          </ion-icon>

          <ion-label>
            Dark Mode
          </ion-label>
        </ion-item>

      </ion-card-content>

    </ion-card>


    <p class="version">
      SIMOBILE v1.0.0
    </p>

  </div>

</ion-content>
