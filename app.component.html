<ion-app>

  <!-- SIDE MENU -->
  <ion-menu contentId="main-content" type="overlay">

    <ion-header>
      <ion-toolbar>
        <ion-title>SIMOBILE</ion-title>
      </ion-toolbar>
    </ion-header>

    <ion-content>

      <!-- MENU UTAMA -->
      <ion-list>

        <ion-list-header>
          Menu Utama
        </ion-list-header>

        @for (p of appPages; track p) {
          <ion-menu-toggle auto-hide="false">

            <ion-item
              [routerLink]="[p.url]"
              routerDirection="root"
              lines="none"
              detail="false"
            >

              <ion-icon
                slot="start"
                [name]="p.icon"
              ></ion-icon>

              <ion-label>
                {{ p.title }}
              </ion-label>

            </ion-item>

          </ion-menu-toggle>
        }

      </ion-list>


      <!-- MENU TAMBAHAN -->
      <ion-list>

        <ion-list-header>
          Lainnya
        </ion-list-header>

        @for (p of menuPages; track p) {
          <ion-menu-toggle auto-hide="false">

            <ion-item
              [routerLink]="[p.url]"
              routerDirection="root"
              lines="none"
              detail="false"
            >

              <ion-icon
                slot="start"
                [name]="p.icon"
              ></ion-icon>

              <ion-label>
                {{ p.title }}
              </ion-label>

            </ion-item>

          </ion-menu-toggle>
        }

      </ion-list>

    </ion-content>

  </ion-menu>


  <!-- HALAMAN UTAMA -->
  <ion-router-outlet id="main-content"></ion-router-outlet>

</ion-app>
