<ion-header>
  <ion-toolbar>

    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>

    <ion-title>
      Pengaturan
    </ion-title>

  </ion-toolbar>
</ion-header>


<ion-content [fullscreen]="true">

  <ion-list>

    <ion-list-header>
      <ion-label>
        Pengaturan Tampilan
      </ion-label>
    </ion-list-header>

    <ion-item>

      <ion-icon
        slot="start"
        name="moon-outline">
      </ion-icon>

      <ion-label>
        <h2>Dark Mode</h2>
        <p>Ubah tampilan menjadi mode gelap</p>
      </ion-label>

      <ion-toggle
        [(ngModel)]="darkMode"
        (ionChange)="toggleDarkMode()">
      </ion-toggle>

    </ion-item>

  </ion-list>

</ion-content>
